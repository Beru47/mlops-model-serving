groups:
  - name: model-serving
    rules:
      - alert: HighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(api_request_latency_seconds_bucket{endpoint="/predict"}[1m]))) > 0.05
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "p95 /predict latency above the 50 ms target"
      - alert: HighErrorRate
        expr: sum(rate(api_requests_total{status!~"2.."}[5m])) / sum(rate(api_requests_total[5m])) > 0.05
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "More than 5% of requests fail"
      - alert: FeatureDrift
        expr: drift_detected == 1
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Live feature distribution drifted from the training reference (PSI and KS agree)"
      - alert: FeaturePSIHigh
        expr: feature_drift_psi > 0.25
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "PSI above 0.25 on {{ $labels.feature }}"
