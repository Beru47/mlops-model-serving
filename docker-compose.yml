services:
  trainer:
    build: .
    command: python -m mlops.pipeline
    environment: &mlflow
      MLFLOW_TRACKING_URI: sqlite:////data/mlflow.db
    volumes: [mlflow-data:/data]

  api:
    build: .
    command: uvicorn mlops.serve:app --host 0.0.0.0 --port 8000
    environment: *mlflow
    volumes: [mlflow-data:/data]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      trainer: {condition: service_completed_successfully}

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-locally}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus]

volumes:
  mlflow-data:
