name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: Train-and-register smoke run
        run: |
          python -m mlops.pipeline --run-key ci-smoke | tee out.json
          python -c "import json; r=json.load(open('out.json')); assert r['promoted'], r"
