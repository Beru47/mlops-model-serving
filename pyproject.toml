[project]
name = "mlops-model-serving"
version = "0.1.0"
description = "MLflow registry, FastAPI serving, drift monitoring and Airflow retraining on a synthetic dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mlflow-skinny>=2.16",
  "sqlalchemy>=2",
  "alembic",
  "scikit-learn>=1.4",
  "pandas>=2",
  "scipy>=1.11",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "prometheus-client>=0.20",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "dags"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
